<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login | Rohan Keshri Portfolio</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body class="admin-body">
  <div class="bg-canvas" id="bgCanvas"></div>
  <div class="noise-overlay"></div>

  <div class="admin-login-wrap">
    <div class="admin-login-card">
      <div class="admin-login-logo">
        <span class="logo-bracket">&lt;</span>RK<span class="logo-bracket">/&gt;</span>
        <span class="admin-tag">ADMIN</span>
      </div>
      <h1 class="admin-login-title">Welcome back</h1>
      <p class="admin-login-sub">Sign in to manage your portfolio content</p>

      <form class="admin-login-form" id="loginForm" autocomplete="off" novalidate>
        <div class="admin-form-group">
          <label for="adminUser">Username</label>
          <div class="admin-input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input type="text" id="adminUser" placeholder="Username" autocomplete="off" spellcheck="false" required />
          </div>
        </div>
        <div class="admin-form-group">
          <label for="adminPass">Password</label>
          <div class="admin-input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="adminPass" placeholder="Password" autocomplete="current-password" required />
            <button type="button" class="toggle-pass" id="togglePass" aria-label="Toggle password visibility">
              <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="admin-error" id="loginError" style="display:none;"></div>

        <button type="submit" class="btn btn-primary btn-full admin-submit-btn" id="loginBtn">
          <span id="loginBtnText">Sign In</span>
          <svg id="loginBtnIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        </button>
      </form>

      <a href="/" class="admin-back-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        Back to Portfolio
      </a>
    </div>
  </div>

  <script src="../script.js"></script>
  <script>
    // Redirect if already logged in
    (function() {
      const token = localStorage.getItem('rk_admin_token');
      if (token) {
        fetch('/api/auth/verify', { method: 'POST', headers: { 'Authorization': `Bearer ${token}` } })
          .then(r => r.json())
          .then(d => { if (d.valid) window.location.href = '/admin/dashboard'; })
          .catch(() => {});
      }
    })();

    document.getElementById('togglePass').addEventListener('click', function() {
      const input = document.getElementById('adminPass');
      input.type = input.type === 'password' ? 'text' : 'password';
    });

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const btnText = document.getElementById('loginBtnText');
      const errorEl = document.getElementById('loginError');
      const username = document.getElementById('adminUser').value.trim();
      const password = document.getElementById('adminPass').value;

      errorEl.style.display = 'none';
      btn.disabled = true;
      btnText.textContent = 'Signing in...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login failed');
        localStorage.setItem('rk_admin_token', data.token);
        window.location.href = '/admin/dashboard';
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = 'block';
        btn.disabled = false;
        btnText.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
